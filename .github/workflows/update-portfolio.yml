name: Update portfolio
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_projects.py
      - .github/workflows/update-portfolio.yml

permissions:
  contents: write

concurrency:
  group: profile-portfolio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public projects
        run: python3 scripts/update_projects.py
      - name: Commit meaningful changes
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh public project portfolio"
          git push
